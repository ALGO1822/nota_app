name: nota_app
description: "Nota - Generative PDF study companion."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_bloc: ^9.1.1
  pdfrx: ^2.2.24
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  webview_flutter: ^4.14.1
  phosphor_flutter: ^2.1.0
  file_picker: ^13.3.1
  path_provider: ^2.1.6
  equatable: ^3.0.0
  google_generative_ai: ^0.4.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.13

flutter:
  uses-material-design: true

  assets:
    - assets/mermaid/

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/inter/Inter-VariableFont.ttf
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/jetbrains_mono/JetBrainsMono-VariableFont.ttf
    - family: Newsreader
      fonts:
        - asset: assets/fonts/newsreader/Newsreader-VariableFont.ttf
        - asset: assets/fonts/newsreader/Newsreader-Italic-VariableFont.ttf
          style: italic
